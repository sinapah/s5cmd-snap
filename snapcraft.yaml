name: s5cmd
base: core24
version: '2.3.0'
summary: Very fast S3 and local filesystem execution tool
description: |
  Very fast S3 and local filesystem execution tool. It comes with support
  for a multitude of operations including tab completion and wildcard
  support for files, which can be very handy for your object storage
  workflow while working with large number of files.
grade: devel
confinement: strict
license: MIT
website: https://github.com/peak/s5cmd
source-code: https://github.com/peak/s5cmd

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  s5cmd:
    command: bin/s5cmd
    plugs:
      - home
      - network

parts:
  s5cmd:
    plugin: nil
    source: https://github.com/peak/s5cmd
    source-type: git
    source-tag: v2.3.0
    source-depth: 1
    build-snaps:
      - go/1.22/stable
    build-packages:
      - git
    override-build: |
      GIT_COMMIT=$(git -C "$SNAPCRAFT_PART_SRC" rev-parse --short HEAD)
      CGO_ENABLED=0 go build -mod=vendor \
        -ldflags "-s -w -X github.com/peak/s5cmd/v2/version.Version=v2.3.0 -X github.com/peak/s5cmd/v2/version.GitCommit=${GIT_COMMIT}" \
        -o "$SNAPCRAFT_PART_INSTALL/bin/s5cmd" .
